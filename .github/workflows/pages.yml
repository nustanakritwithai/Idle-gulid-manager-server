name: Publish Guild Arena Dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check config.js
          node --check player.js
      - name: Verify public API and access control
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://guild-arena.157.85.96.139.sslip.io';
          const health = await fetch(`${base}/health/live`);
          assert.equal(health.status, 200);
          assert.equal((await health.json()).status, 'ok');
          assert.equal((await fetch(`${base}/api/v1/system/status`)).status, 401);
          assert.equal((await fetch(`${base}/api/v1/players`)).status, 401);
          assert.equal((await fetch(`${base}/api/v1/player/me`)).status, 401);
          const playerConfig = await fetch(`${base}/api/v1/player/auth/config`);
          assert.equal(playerConfig.status, 200);
          assert.equal((await playerConfig.json()).passwordMinLength, 15);
          assert.equal((await fetch(`${base}/api/v1/teams`, {headers: {Origin: 'https://invalid.example'}})).status, 403);
          const cors = await fetch(`${base}/api/v1/teams`, {method: 'OPTIONS', headers: {Origin: 'https://nustanakritwithai.github.io', 'Access-Control-Request-Method': 'GET', 'Access-Control-Request-Headers': 'authorization'}});
          assert.equal(cors.status, 204);
          assert.equal(cors.headers.get('access-control-allow-origin'), 'https://nustanakritwithai.github.io');
          console.log('HTTPS, unauthorized API rejection, and CORS passed from GitHub runner.');
          JS
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir public
          cp index.html styles.css app.js config.js player.html player.js player.css .nojekyll public/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
